data:
  processed_path: data/processed/cs-processed.csv
  target_column: SeriousDlqin2yrs
  test_size: 0.2
  random_state: 42

features:
  drop_columns: []  # Add column names here if you want to exclude any

models:
  - name: logistic_regression
    params:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
      random_state: 42

  - name: random_forest
    params:
      n_estimators: 100
      max_depth: 10
      class_weight: balanced
      random_state: 42

output:
  models_dir: models/
  logs_dir: logs/
  log_file: logs/experiments.csv